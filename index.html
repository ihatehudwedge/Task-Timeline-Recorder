<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업 이력 및 타임라인 통합 관리 시스템</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 헤더 -->
  <header>
    <div class="brand-area">
      <div class="brand-icon">TL</div>
      <div class="brand-title">작업 타임라인 통합 보드</div>
      <div id="folderStatusBadge" class="file-status-badge" title="공유 폴더를 연결하면 각 카드가 폴더 내 개별 파일로 분리 저장됩니다.">
        <span class="status-dot"></span>
        <span id="folderStatusText">로컬 임시 모드 (공유 카드 폴더 미연결)</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" onclick="connectCardDirectory()" title="카드가 개별 파일로 저장될 공유 폴더를 연결합니다 (Chrome/Edge 지원)">
        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        공유 카드 폴더 연결
      </button>
      <button class="btn" onclick="triggerImportCardFiles()" title="개별 카드 파일들을 직접 선택하여 보드로 불러옵니다">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 14h-3v3h-2v-3H8v-2h3v-3h2v3h3v2zm-3-7V3.5L18.5 9H13z"/></svg>
        카드 파일 불러오기
      </button>
      <button class="btn" onclick="reloadCardsFromDirectory()" title="연결된 공유 폴더에서 모든 카드 파일의 최신 상태를 다시 읽어옵니다">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        카드 목록 새로고침
      </button>
      <button class="btn btn-primary" onclick="openDrawerForNewCard()">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        새 카드 등록
      </button>
      <!-- 개별 카드 파일 다중 선택 폴백용 input -->
      <input type="file" id="cardFilesInput" accept=".json,.card" multiple style="display:none" onchange="handleImportCardFiles(event)">
    </div>
  </header>

  <!-- 검색 및 필터 바 -->
  <div class="toolbar">
    <div class="filter-group">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="작업명, 작업자, 작성자, 타임라인 메모 검색..." oninput="renderBoard()">
      </div>

      <div class="status-filter-pills" id="statusFilterGroup">
        <button class="filter-pill active" data-filter="ALL" onclick="setStatusFilter('ALL')">전체</button>
        <button class="filter-pill" data-filter="대기" onclick="setStatusFilter('대기')">대기</button>
        <button class="filter-pill" data-filter="진행" onclick="setStatusFilter('진행')">진행</button>
        <button class="filter-pill" data-filter="이슈발생" onclick="setStatusFilter('이슈발생')">이슈발생</button>
        <button class="filter-pill" data-filter="종료" onclick="setStatusFilter('종료')">종료</button>
      </div>

      <select id="workerFilterSelect" class="filter-select" onchange="renderBoard()">
        <option value="ALL">모든 작업자</option>
      </select>
    </div>

    <div class="summary-counts" id="summaryCounts"></div>
  </div>

  <!-- 메인 워크스페이스 (좌측 슬라이드 수정 탭 + 우측 카드 그리드) -->
  <div class="workspace">
    
    <!-- 왼쪽 수정/입력 탭 (Drawer) -->
    <aside id="leftDrawer" class="left-drawer">
      <div class="drawer-inner">
        <div class="drawer-header">
          <div class="drawer-title">
            <span id="drawerModeTitle">카드 수정</span>
            <span id="drawerCardId" class="card-id-badge"></span>
          </div>
          <button class="btn btn-sm" onclick="closeDrawer()">닫기 ✕</button>
        </div>

        <div class="drawer-body">
          <!-- 1. 작업 기본 정보 -->
          <div class="form-section">
            <div class="form-group">
              <label class="form-label">작업명</label>
              <input type="text" id="editTitle" class="form-input" placeholder="작업명을 입력하세요">
            </div>

            <div class="form-group">
              <label class="form-label">작업 현황 (4단계)</label>
              <div class="status-selector" id="editStatusSelector">
                <button type="button" class="status-opt-btn" data-status="대기" onclick="selectEditStatus('대기')">대기</button>
                <button type="button" class="status-opt-btn" data-status="진행" onclick="selectEditStatus('진행')">진행</button>
                <button type="button" class="status-opt-btn" data-status="이슈발생" onclick="selectEditStatus('이슈발생')">이슈발생</button>
                <button type="button" class="status-opt-btn" data-status="종료" onclick="selectEditStatus('종료')">종료</button>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">담당 작업자</label>
                <input type="text" id="editWorker" class="form-input" placeholder="실무 작업자 이름">
              </div>
              <div class="form-group">
                <label class="form-label">카드 작성자</label>
                <input type="text" id="editAuthor" class="form-input" placeholder="최초 기록자 이름">
              </div>
            </div>
          </div>

          <!-- 2. 타임라인 메모 추가 (템플릿 제공) -->
          <div class="form-section">
            <label class="form-label">타임라인 이력 추가</label>
            <div class="timeline-builder">
              
              <div>
                <div class="chip-group-label">⚡ 시간 빠른 설정 (직접 수정 가능)</div>
                <div class="template-chips" style="margin-bottom: 6px;">
                  <button type="button" class="chip accent" onclick="setQuickTime(0)">지금 시간</button>
                  <button type="button" class="chip" onclick="setQuickTime(-5)">-5분</button>
                  <button type="button" class="chip" onclick="setQuickTime(-10)">-10분</button>
                  <button type="button" class="chip" onclick="setQuickTime(-30)">-30분</button>
                  <button type="button" class="chip" onclick="setQuickTime(-60)">-1시간</button>
                </div>
                <div class="form-row">
                  <input type="text" id="tlTimeInput" class="form-input" placeholder="YYYY-MM-DD HH:MM">
                  <input type="text" id="tlAuthorInput" class="form-input" placeholder="메모 작성자">
                </div>
              </div>

              <div>
                <div class="chip-group-label">📋 작업 문구 원클릭 템플릿 (클릭 시 입력창에 삽입)</div>
                <div class="template-chips" id="memoTemplateContainer"></div>
              </div>

              <textarea id="tlMemoInput" class="form-textarea" placeholder="메신저 공유 내용이나 시간대별 진행 상황을 입력하세요. (Ctrl+Enter 로 즉시 추가)" onkeydown="handleMemoKeydown(event)"></textarea>

              <button type="button" class="btn btn-primary" onclick="addTimelineEntryInDrawer()" style="width:100%;">
                + 타임라인에 이 기록 추가
              </button>
            </div>
          </div>

          <!-- 3. 누적된 타임라인 목록 -->
          <div class="form-section">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label class="form-label">누적 타임라인 기록 (<span id="drawerTlCount">0</span>건)</label>
              <span style="font-size:11px; color:var(--text-muted);">최신순 정렬</span>
            </div>
            <div id="drawerTimelineList" class="drawer-timeline-list"></div>
          </div>
        </div>

        <div class="drawer-footer">
          <button type="button" id="deleteCardBtn" class="btn btn-danger" onclick="deleteCurrentCard()">카드 삭제</button>
          <div style="display:flex; gap:8px; margin-left:auto;">
            <button type="button" class="btn" onclick="closeDrawer()">취소</button>
            <button type="button" class="btn btn-primary" onclick="saveCardAndSync()">카드 저장</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- 오른쪽 메인 보드 -->
    <main class="main-board">
      <div id="cardsGrid" class="cards-grid"></div>
    </main>

  </div>

  <!-- 알림 토스트 영역 -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
